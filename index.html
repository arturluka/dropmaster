<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Brawl Ball Online</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body { background: #111; overflow: hidden; font-family: Arial; }
  canvas { display: block; }
.joystick {
    position: fixed; width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4);
  }
  #moveJoy { bottom: 30px; left: 30px; }
  #shootJoy { bottom: 30px; right: 30px; }
.stick {
    position: absolute; width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.6); top: 35px; left: 35px;
  }
.btn {
    position: fixed; width: 70px; height: 70px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4);
    color: white; font-weight: bold; display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  #pickBtn { bottom: 170px; right: 30px; }
  #dropBtn { bottom: 170px; right: 110px; }
.hud { position: fixed; top: 20px; left: 20px; color: white; font-weight: bold; text-shadow: 2px 2px 4px #000; }
  #nameScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10;
  }
  #nameScreen input {
    padding: 15px; font-size: 18px; border-radius: 8px; border: none;
    width: 250px; text-align: center; margin-bottom: 20px;
  }
  #nameScreen button {
    padding: 15px 30px; font-size: 18px; border-radius: 8px; border: none;
    background: #4CAF50; color: white; font-weight: bold;
  }
  #status { color: #FFC107; margin-top: 20px; }
</style>
</head>
<body>
<div id="nameScreen">
  <h2 style="color:white; margin-bottom:20px;">Brawl Ball Online</h2>
  <input type="text" id="nameInput" placeholder="Seu nome" maxlength="12">
  <button id="startBtn">ENTRAR</button>
  <div id="status">Conectando...</div>
</div>

<canvas id="game"></canvas>
<div class="hud" id="hud">Conectando...</div>
<div class="joystick" id="moveJoy"><div class="stick" id="moveStick"></div></div>
<div class="joystick" id="shootJoy"><div class="stick" id="shootStick"></div></div>
<div class="btn" id="pickBtn">PEGAR</div>
<div class="btn" id="dropBtn">SOLTAR</div>

<script>
const socket = io(window.location.origin);

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const WORLD_SIZE = 2000;
let player = null;
let players = {};
let bullets = [];
let weapons = [
  { x: 900, y: 1000, type: 'Pistol', color: '#FF9800', dmg: 10, fireRate: 300, bulletSpeed: 8 },
  { x: 1100, y: 950, type: 'Shotgun', color: '#F44336', dmg: 8, fireRate: 800, bulletSpeed: 7, spread: 3 },
  { x: 1000, y: 1150, type: 'Rifle', color: '#9C27B0', dmg: 15, fireRate: 150, bulletSpeed: 12 }
];

const camera = { x: 0, y: 0 };
let moveVec = { x: 0, y: 0 };
let shootVec = { x: 0, y: 0 };
let lastShot = 0;
let gameStarted = false;

socket.on('connect', () => {
  document.getElementById('status').textContent = 'Conectado! Digite seu nome';
});

socket.on('currentPlayers', (serverPlayers) => {
  players = serverPlayers;
  player = players[socket.id];
  updateHUD();
});

socket.on('newPlayer', (newPlayer) => {
  players[newPlayer.id] = newPlayer;
});

socket.on('playerMoved', (playerData) => {
  if (players[playerData.id] && playerData.id!== socket.id) {
    players[playerData.id].x = playerData.x;
    players[playerData.id].y = playerData.y;
  }
});

socket.on('playerDisconnect', (id) => {
  delete players[id];
});

socket.on('newBullet', (bullet) => {
  bullets.push(bullet);
});

socket.on('playerUpdateWeapon', (data) => {
  if (players[data.id]) players[data.id].weapon = data.weapon;
  if (data.id === socket.id) updateHUD();
});

socket.on('playerHealthUpdate', (data) => {
  if (players[data.id]) players[data.id].hp = data.hp;
  if (data.id === socket.id) updateHUD();
});

socket.on('playerDied', (data) => {
  if (players[data.id]) {
    players[data.id].x = 1000 + Math.random() * 200;
    players[data.id].y = 1000 + Math.random() * 200;
    players[data.id].hp = 100;
  }
});

document.getElementById('startBtn').onclick = () => {
  const name = document.getElementById('nameInput').value.trim() || 'Player';
  const colors = ['#2196F3', '#4CAF50', '#FF9800', '#E91E63', '#9C27B0'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  socket.emit('joinGame', { name, color });
  document.getElementById('nameScreen').style.display = 'none';
  gameStarted = true;
  loop();
};

function setupJoystick(joyId, stickId, onMove) {
  const joy = document.getElementById(joyId);
  const stick = document.getElementById(stickId);
  let touchId = null;

  const getTouch = (touches) => {
    for (let t of touches) if (t.identifier === touchId) return t;
    return null;
  };

  const handleStart = (e) => {
    e.preventDefault();
    const touch = e.changedTouches[0];
    touchId = touch.identifier;
  };

  const handleMove = (e) => {
    e.preventDefault();
    const touch = getTouch(e.touches);
    if (!touch) return;
    const rect = joy.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    let dx = touch.clientX - cx;
    let dy = touch.clientY - cy;
    const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 60);
    const angle = Math.atan2(dy, dx);
    dx = Math.cos(angle) * dist;
    dy = Math.sin(angle) * dist;
    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    onMove(dx/60, dy/60);
  };

  const handleEnd = (e) => {
    e.preventDefault();
    const touch = getTouch(e.changedTouches);
    if (!touch) return;
    touchId = null;
    stick.style.transform = 'translate(0, 0)';
    onMove(0, 0);
  };

  joy.addEventListener('touchstart', handleStart);
  joy.addEventListener('touchmove', handleMove);
  joy.addEventListener('touchend', handleEnd);
  joy.addEventListener('touchcancel', handleEnd);
}

setupJoystick('moveJoy', 'moveStick', (x, y) => { moveVec = {x, y}; });
setupJoystick('shootJoy', 'shootStick', (x, y) => { shootVec = {x, y}; });

document.getElementById('pickBtn').addEventListener('touchstart', (e) => { e.preventDefault(); pickWeapon(); });
document.getElementById('dropBtn').addEventListener('touchstart', (e) => { e.preventDefault(); dropWeapon(); });

function pickWeapon() {
  if (!player || player.weapon) return;
  for (let w of weapons) {
    const dist = Math.hypot(player.x - w.x, player.y - w.y);
    if (dist < player.r + 15) {
      socket.emit('pickupWeapon', w);
      break;
    }
  }
}

function dropWeapon() {
  if (!player ||!player.weapon) return;
  socket.emit('dropWeapon');
}

function updateHUD() {
  if (!player) return;
  document.getElementById('hud').textContent = `${player.name} | HP: ${player.hp} | ${player.weapon? player.weapon.type : 'Sem arma'} | Players: ${Object.keys(players).length}`;
}

function shoot() {
  if (!player ||!player.weapon || shootVec.x === 0 && shootVec.y === 0) return;
  if (Date.now() - lastShot < player.weapon.fireRate) return;
  lastShot = Date.now();
  const angle = Math.atan2(shootVec.y, shootVec.x);
  const shots = player.weapon.spread || 1;

  for (let i = 0; i < shots; i++) {
    const spreadAngle = angle + (i - (shots-1)/2) * 0.2;
    socket.emit('playerShoot', {
      x: player.x + Math.cos(spreadAngle) * player.r,
      y: player.y + Math.sin(spreadAngle) * player.r,
      vx: Math.cos(spreadAngle) * player.weapon.bulletSpeed,
      vy: Math.sin(spreadAngle) * player.weapon.bulletSpeed,
      r: 5, color: player.weapon.color, dmg: player.weapon.dmg
    });
  }
}

function update() {
  if (!gameStarted ||!player) return;

  player.x += moveVec.x * 4;
  player.y += moveVec.y * 4;
  player.x = Math.max(player.r, Math.min(WORLD_SIZE - player.r, player.x));
  player.y = Math.max(player.r, Math.min(WORLD_SIZE - player.r, player.y));

  socket.emit('playerMovement', { x: player.x, y: player.y });

  camera.x = player.x - canvas.width/2;
  camera.y = player.y - canvas.height/2;

  shoot();

  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].x += bullets[i].vx;
    bullets[i].y += bullets[i].vy;

    if (bullets[i].ownerId!== socket.id && player) {
      const dist = Math.hypot(bullets[i].x - player.x, bullets[i].y - player.y);
      if (dist < player.r + bullets[i].r) {
        socket.emit('takeDamage', { targetId: socket.id, dmg: bullets[i].dmg });
        bullets.splice(i, 1);
        continue;
      }
    }

    if (bullets[i].x < 0 || bullets[i].x > WORLD_SIZE || bullets[i].y < 0 || bullets[i].y > WORLD_SIZE) {
      bullets.splice(i, 1);
    }
  }
}

function draw() {
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

  ctx.strokeStyle = 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 1;
  for (let i = 0; i < WORLD_SIZE; i += 100) {
    ctx.beginPath();
    ctx.moveTo(i, 0); ctx.lineTo(i, WORLD_SIZE);
    ctx.moveTo(0, i); ctx.lineTo(WORLD_SIZE, i);
    ctx.stroke();
  }

  weapons.forEach(w => {
    ctx.fillStyle = w.color;
    ctx.fillRect(w.x - 12, w.y - 12, 24, 24);
    ctx.fillStyle = '#fff';
    ctx.font = '10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(w.type, w.x, w.y + 25);
  });

  bullets.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  });

  Object.values(players).forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    if (p.id === socket.id) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y - p.r - 25);

    const barW = 40, barH = 6;
    const hpPercent = p.hp / p.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(p.x - barW/2, p.y - p.r - 18, barW, barH);
    ctx.fillStyle = hpPercent > 0.3? '#4CAF50' : '#F44336';
    ctx.fillRect(p.x - barW/2, p.y - p.r - 18, barW * hpPercent, barH);
  });

  ctx.restore();
}

function loop() {
  if (!gameStarted) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
